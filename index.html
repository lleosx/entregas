<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Entregas</title>
<meta name="theme-color" content="#0d1014">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Entregas">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* VOICE: calmo e direto, com a marca do Leonardo (LS) — mesma família do portfólio
   IDEA: mapa de bolso do entregador: o mapa é o protagonista, a interface some quando não é usada
   PICTURE: o próprio mapa da cidade, ruas reais e casa por casa
   COLOUR and TYPE: grafite e azul-céu do portfólio (#0d1014 / #38a9f5); Outfit nos números e títulos, Plus Jakarta Sans no texto
   LAYOUT: busca flutuando no topo, controles agrupados à direita, gaveta embaixo com hierarquia clara */
:root{color-scheme:light dark;
--bg:light-dark(#eef1f4,#0d1014);--road:light-dark(#ffffff,#1d252e);--major:light-dark(#dceaf7,#263546);--track:light-dark(#e4e6e3,#171c21);--casing:light-dark(#d3d9e0,#06080a);
--ink:light-dark(#151a20,#eef1f4);--mut:light-dark(#5e6b78,#93a0ad);--faint:light-dark(#8f9aa6,#5f6b77);--card:light-dark(#ffffff,#151a20);
--soft:light-dark(#eef1f4,#1d242c);--line:light-dark(#e3e7ec,#262e37);--house:light-dark(#9ea8b3,#4d5866);--shop:#8ea6ff;
--acc:#38a9f5;--accink:#04121f;--accsoft:light-dark(#e2f2fd,#0f2a3d);--halo:light-dark(#ffffffe6,#0d1014e6);--me:#0b5cad;--route:#38a9f5;
--mine:light-dark(#1f9d63,#4fd18b);--danger:light-dark(#d93a2b,#ff8a7a);--dangersoft:light-dark(#fdecea,#361c1a);--warn:light-dark(#fff4dc,#2b2416);
--shadow:0 1px 2px #0000000f,0 6px 20px #00000014;
--cond:"Outfit","Barlow Condensed",system-ui,sans-serif;--sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
#map{position:fixed;inset:0;touch-action:none}
#map canvas{width:100%;height:100%;display:block}
.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;pointer-events:none;z-index:3}
.top>*{pointer-events:auto;max-width:560px;margin:0 auto}
.search{display:flex;align-items:center;background:var(--card);border-radius:16px;box-shadow:var(--shadow);height:52px;padding:0 6px 0 16px}
.search svg{flex:none;color:var(--faint)}
#q{flex:1;border:0;background:none;color:var(--ink);font:400 17px var(--sans);height:100%;padding:0 10px;outline:none}
#q::-webkit-search-cancel-button{display:none}#q::placeholder{color:var(--faint)}
.search:has(#q:focus){box-shadow:var(--shadow),0 0 0 2px color-mix(in srgb,var(--acc) 55%,transparent)}
.ib{flex:none;width:44px;height:44px;border:0;border-radius:12px;background:none;color:var(--faint);font-size:22px;cursor:pointer;display:grid;place-items:center}
:is(.ib,.btn,.row,.chip,.fab button,.tool,.end):focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.turn{display:flex;align-items:center;gap:14px;background:#151a20;color:#fff;border-radius:18px;padding:14px 18px;box-shadow:0 8px 24px #00000030}
.turn svg{flex:none;width:46px;height:46px;color:#38a9f5}
.turn .d{font:700 30px/1 var(--cond);white-space:nowrap;letter-spacing:.01em}
.turn .tx{font:500 17px/1.25 var(--sans);color:#e6e9ee;text-wrap:balance;margin-top:2px}
.fab{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 76px);display:grid;gap:10px;z-index:2;justify-items:end}
.fab button{width:44px;height:44px;border:0;background:var(--card);color:var(--ink);font:500 22px/1 var(--sans);cursor:pointer;display:grid;place-items:center}
.fab>button{border-radius:50%;box-shadow:var(--shadow)}
.fab .zoom{display:grid;border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.fab .zoom button{border-radius:0;height:44px}.fab .zoom button+button{border-top:1px solid var(--line)}
.fab button.on{color:var(--me)}#cmp.on{box-shadow:var(--shadow),inset 0 0 0 2px var(--me)}
body.navon .fab{top:calc(env(safe-area-inset-top) + 112px)}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -2px 18px #00000018;z-index:3;height:var(--sh,52vh);transition:height .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet.drag{transition:none}.sheet.mini .body{overflow:hidden}
.grab{border:0;background:none;width:100%;height:28px;display:grid;place-items:center;cursor:grab;flex:none;touch-action:none}
.grab i{width:36px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--mut) 35%,transparent)}
.body{overflow-y:auto;padding:2px 20px 20px;overscroll-behavior:contain}
.kick{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--acc);margin:0 0 2px;letter-spacing:.01em}.kick img{height:20px;width:auto}
h2{font:650 22px/1.2 var(--sans);margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--mut);font-size:15px;margin:0 0 14px}
.lab{font-size:13px;font-weight:600;color:var(--mut);margin:18px 0 4px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:10px 0;border-bottom:1px solid var(--line);font:inherit;cursor:pointer;min-height:56px}
.row:last-of-type{border-bottom:0}
.row .pin{flex:none;min-width:40px;height:32px;padding:0 6px;border-radius:9px;background:var(--soft);color:var(--ink);display:grid;place-items:center;font:600 15px var(--cond);letter-spacing:.02em}
.row .t{flex:1}.row .t strong{display:block;font-weight:550}.row .t span{font-size:14px;color:var(--mut)}
.addr{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 4px}
.addr .st{font:650 22px/1.2 var(--sans);letter-spacing:-.01em;text-wrap:balance}
.addr .nu{flex:none;font:700 30px/1 var(--cond);color:var(--acc);background:var(--accsoft);border-radius:14px;padding:8px 14px;white-space:nowrap}
.note{display:flex;gap:10px;background:var(--warn);border-radius:14px;padding:12px 14px;font-size:15px;margin:8px 0 6px;color:var(--ink)}
.note::before{content:"!";flex:none;width:20px;height:20px;border-radius:50%;background:#f2b84b;color:#fff;font:700 13px/20px var(--sans);text-align:center;margin-top:1px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:14px;border:0;font:600 17px var(--sans);text-decoration:none;cursor:pointer;padding:0 16px;text-align:center;width:100%;transition:transform .12s,filter .12s}
.btn:active,.tool:active,.end:active,.row:active{transform:scale(.98)}
.btn.p{background:var(--acc);color:var(--accink);margin:14px 0 10px;box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 30%,transparent)}
.btn.g{background:var(--soft);color:var(--ink);font:500 15px var(--sans);min-height:44px;width:auto;border-radius:12px;padding:0 14px}
.btn svg,.tool svg,.end svg{width:18px;height:18px;flex:none}
.links{display:flex;flex-wrap:wrap;gap:8px}
.meta{font-size:14px;color:var(--mut);margin:10px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-width:54px;height:40px;border-radius:10px;border:0;background:var(--soft);color:var(--ink);font:600 17px var(--cond);cursor:pointer;padding:0 10px}
.navtop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 14px}
.eta{display:grid;gap:2px}
.eta b{font:700 34px/1 var(--cond);letter-spacing:.01em}
.eta b small{font:500 15px var(--sans);color:var(--mut);margin-left:6px;letter-spacing:0}
.eta span{font-size:14px;color:var(--mut)}
.end{flex:none;display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 18px 0 14px;border:0;border-radius:999px;background:var(--dangersoft);color:var(--danger);font:600 16px var(--sans);cursor:pointer;transition:transform .12s}
.end svg{width:20px;height:20px}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tool{display:grid;justify-items:center;gap:4px;padding:10px 4px;min-height:64px;border:0;border-radius:14px;background:var(--soft);color:var(--ink);font:500 13px var(--sans);cursor:pointer;transition:transform .12s}
.tool.off{color:var(--faint)}
.dest{display:flex;align-items:center;gap:10px;margin:0 0 14px;padding:12px 14px;border-radius:14px;background:var(--soft);font-size:15px}
.dest i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px var(--accsoft)}
.foot{font-size:13px;color:var(--faint);margin-top:18px;line-height:1.5}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 72px);transform:translateX(-50%);background:#151a20;color:#eef1f4;padding:10px 16px;border-radius:12px;font-size:15px;z-index:5;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 6px 20px #00000030}
.toast.on{opacity:1}
#pick{position:fixed;z-index:2;transform:translate(-50%,-100%);pointer-events:none;filter:drop-shadow(0 4px 6px #0004)}
#pick::after{content:"";position:absolute;left:50%;bottom:-3px;width:10px;height:4px;margin-left:-5px;border-radius:50%;background:#0005}
.form{display:grid;gap:12px;margin:4px 0 6px}
.field{display:grid;gap:6px}.field span{font-size:13px;font-weight:600;color:var(--mut)}
.field input{height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--soft);color:var(--ink);font:400 17px var(--sans);padding:0 14px;outline:none;width:100%}
.field input:focus{border-color:color-mix(in srgb,var(--acc) 60%,transparent);background:var(--card)}
.two{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px}
.btn.danger{background:var(--dangersoft);color:var(--danger)}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--mine);background:color-mix(in srgb,var(--mine) 14%,transparent);border-radius:999px;padding:3px 9px;margin:0 0 8px}
#cfg{color:var(--mut)}#cfg:active{transform:rotate(40deg)}
.sec{margin:18px 0 0}.sec h3{font:600 13px var(--sans);color:var(--mut);margin:0 0 8px;letter-spacing:.01em}
.card{background:var(--soft);border-radius:16px;overflow:hidden}
.set{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 16px;border:0;background:none;color:var(--ink);font:500 16px var(--sans);text-align:left;cursor:pointer}
.set+.set{border-top:1px solid var(--line)}.set .t{flex:1}.set .t small{display:block;font-size:13px;color:var(--mut);font-weight:400;margin-top:1px}
.set .chev{color:var(--faint)}
.sw{flex:none;width:50px;height:30px;border-radius:999px;background:color-mix(in srgb,var(--mut) 35%,transparent);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0004;transition:transform .2s}
[aria-checked=true] .sw{background:var(--acc)}[aria-checked=true] .sw::after{transform:translateX(20px)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;background:var(--soft);border-radius:14px}
.seg button{height:40px;border:0;border-radius:11px;background:none;color:var(--mut);font:500 15px var(--sans);cursor:pointer}
.seg button[aria-pressed=true]{background:light-dark(#ffffff,#2c3540);color:var(--ink);box-shadow:0 1px 3px #0002}
@media(prefers-reduced-motion:reduce){.sw,.sw::after{transition:none}}
body.navon .toast{top:calc(env(safe-area-inset-top) + 124px)}
@media(prefers-reduced-motion:reduce){.toast,.btn,.tool,.end{transition:none}}
</style>
</head>
<body>
<div id="map"><canvas id="cv"></canvas></div>
<div class="top">
  <div id="srch">
    <form class="search" id="f" autocomplete="off">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" inputmode="search" placeholder="Rua e número — ex: Bahia 245" aria-label="Buscar endereço">
      <button class="ib" type="button" id="clr" aria-label="Limpar" hidden>×</button><button class="ib" type="button" id="cfg" aria-label="Configurações"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </form>
  </div>
  <div class="turn" id="turn" hidden><span id="ticon"></span><div><div class="d" id="tdist"></div><div class="tx" id="ttext"></div></div></div>
</div>
<div class="fab">
  <button id="me" aria-label="Minha localização"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
  <button id="cmp" aria-label="Bússola: norte para cima"><svg id="needle" width="26" height="26" viewBox="0 0 24 24"><path d="M12 3l3.5 9h-7z" fill="#38a9f5"/><path d="M12 21l-3.5-9h7z" fill="currentColor" opacity=".45"/></svg></button>
  <div class="zoom"><button id="zi" aria-label="Aproximar">+</button><button id="zo" aria-label="Afastar">−</button></div>
</div>
<section class="sheet" id="sheet"><button class="grab" id="grab" aria-label="Abrir ou fechar painel"><i></i></button><div class="body" id="body"><p class="sub">Carregando o mapa…</p></div></section>
<input type="file" id="impf" accept="application/json,.json" hidden>
<div id="pick" hidden><svg width="34" height="46" viewBox="0 0 34 46"><path d="M17 45C17 45 2 27 2 16a15 15 0 0 1 30 0c0 11-15 29-15 29z" fill="#1f9d63"/><circle cx="17" cy="16" r="6.5" fill="#fff"/></svg></div>
<div class="toast" id="toast" role="status"></div>
<script>
{
const $=id=>document.getElementById(id);
try{const th=localStorage.getItem('ent-tema');if(th==='light'||th==='dark')document.documentElement.dataset.theme=th}catch(e){}
const cv=$('cv'),ctx=cv.getContext('2d'),body=$('body'),sheet=$('sheet'),q=$('q');
const ESP={1:'Casa',2:'Domicílio coletivo',3:'Propriedade rural',4:'Escola',5:'Saúde',6:'Comércio / serviço',7:'Em construção',8:'Igreja / templo'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const SMALL=new Set(['de','da','do','dos','das','e','a']);
const tc=s=>s.toLowerCase().split(' ').map((w,i)=>/^(ii|iii|iv|pr|sn)$/.test(w)?w.toUpperCase():(i&&SMALL.has(w))?w:w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
const TYPES=new Set(['R','RUA','AV','AVE','AVENIDA','EST','ESTR','ESTRADA','ROD','RODOVIA','PC','PCA','PRACA','TRAV','TRAVESSA']);
const STOP=new Set([...TYPES,'DE','DA','DO','DOS','DAS','E']);
const NUMW={'7':'SETE','9':'NOVE','15':'QUINZE','20':'VINTE'};
const keyTok=s=>new Set(N(s).split(' ').map(w=>NUMW[w]||w).filter(w=>w&&!STOP.has(w)));
const fmtD=m=>m<1000?`${Math.max(10,Math.round(m/10)*10)} m`:`${(m/1000).toFixed(1).replace('.',',')} km`;
const fmtT=s=>s<60?'1 min':s<3600?`${Math.round(s/60)} min`:`${Math.floor(s/3600)} h ${Math.round(s%3600/60)} min`;
let D=null,S=[],R=[],sel=null,selStreet=null,est=null,hiWay=null;
let W=0,H=0,dpr=1,sc=1,tx=0,ty=0;
const lat0=-24.08,lon0=-51.74,KX=Math.cos(lat0*Math.PI/180)*111320,KY=110540;
const P=(la,lo)=>[(lo-lon0)*KX,-(la-lat0)*KY];
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2600)};
let recent=[];try{recent=JSON.parse(localStorage.getItem('ent-rec')||'[]')}catch(e){}
const saveRecent=i=>{recent=[i,...recent.filter(x=>x!==i)].slice(0,6);try{localStorage.setItem('ent-rec',JSON.stringify(recent))}catch(e){}};

/* ---------- ruas (OpenStreetMap) e grafo ---------- */
const SPEED=[16.7,13.9,8.3,5.6,7];const RW=[13,11,8,5,4.5];
let NX,NY,WAYS=[],ADJ=[],DEG,GRID=new Map();const CELL=120;
function prepRoads(r){
  const n=r.p.length;NX=new Float64Array(n);NY=new Float64Array(n);DEG=new Uint8Array(n);
  r.p.forEach((p,i)=>{const[x,y]=P(p[0]/1e6,p[1]/1e6);NX[i]=x;NY[i]=y});
  ADJ=Array.from({length:n},()=>[]);
  r.w.forEach((a,wi)=>{const w={cls:a[0],name:r.nm[a[1]],orig:r.nm[a[1]],ow:a[2],ids:a.slice(3)};w.key=keyTok(w.name);WAYS.push(w);
    for(let k=1;k<w.ids.length;k++){const u=w.ids[k-1],v=w.ids[k],d=Math.hypot(NX[u]-NX[v],NY[u]-NY[v]),c=d/SPEED[w.cls];
      if(w.ow!==-1)ADJ[u].push(v,c,wi);if(w.ow!==1)ADJ[v].push(u,c,wi);DEG[u]++;DEG[v]++;
      const x0=Math.min(NX[u],NX[v]),x1=Math.max(NX[u],NX[v]),y0=Math.min(NY[u],NY[v]),y1=Math.max(NY[u],NY[v]);
      for(let gx=Math.floor(x0/CELL);gx<=Math.floor(x1/CELL);gx++)for(let gy=Math.floor(y0/CELL);gy<=Math.floor(y1/CELL);gy++){const g=gx+','+gy;let l=GRID.get(g);if(!l)GRID.set(g,l=[]);l.push(wi,k)}}});
}
function snap(x,y,rad,pref){let best=null,bs=1e18;const r=Math.ceil(rad/CELL),cx=Math.floor(x/CELL),cy=Math.floor(y/CELL);
  for(let gx=cx-r;gx<=cx+r;gx++)for(let gy=cy-r;gy<=cy+r;gy++){const l=GRID.get(gx+','+gy);if(!l)continue;
    for(let j=0;j<l.length;j+=2){const w=WAYS[l[j]],k=l[j+1],a=w.ids[k-1],b=w.ids[k];const dx=NX[b]-NX[a],dy=NY[b]-NY[a],L=dx*dx+dy*dy||1;
      let t=((x-NX[a])*dx+(y-NY[a])*dy)/L;t=Math.max(0,Math.min(1,t));const px=NX[a]+t*dx,py=NY[a]+t*dy,d=Math.hypot(x-px,y-py);if(d>rad)continue;
      let s=d+(w.cls===4?15:0);if(pref&&pref.size){let m=0;for(const z of pref)if(w.key.has(z))m++;if(m/Math.min(pref.size,w.key.size||1)>=.6)s-=150}
      if(s<bs){bs=s;best={w:l[j],a,b,t,x:px,y:py,d}}}}

  CAD={houses:c.houses.filter(h=>h&&typeof h.la==='number'&&typeof h.lo==='number').map(h=>({id:String(h.id||Math.random().toString(36).slice(2)),ref:h.ref==null?undefined:+h.ref,street:String(h.street||''),n:+h.n||0,comp:String(h.comp||''),la:h.la,lo:h.lo})),ways:Object.fromEntries(Object.entries(c.ways||{}).map(([k,v])=>[String(+k),String(v)]))};
  saveCad();prep();toast('Cópia restaurada');showMine()}).catch(()=>toast('Esse arquivo não é uma cópia do app.'));e.target.value=''});

new ResizeObserver(resize).observe(cv);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);
new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
Promise.all([fetch('dados.json').then(r=>r.json()),fetch('ruas.json').then(r=>r.json())]).then(([d,r])=>{D=d;prepRoads(r);prep();resize();home();fit(town(),60,true)})
  .catch(()=>{body.innerHTML='<h2>Não consegui carregar o mapa</h2><p class="sub">Abra o app uma vez com internet para ele guardar o mapa no celular.</p>'});
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!location.hostname.endsWith('claude.ai')&&!location.hostname.includes('claudeusercontent'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
